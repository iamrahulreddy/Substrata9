name: Substrata9 CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc jq shellcheck

    - name: Make Scripts Executable
      run: |
        chmod +x bin/* 
        chmod +x tests/*.sh || true  # In case the folder doesn't exist

    ###########################################################
    # SHELLCHECK (Non-Fatal Warnings)
    #
    # - Only errors break CI
    # - Warnings/info messages still show in logs
    ###########################################################
    - name: Run ShellCheck (Errors Only)
      run: |
        echo "Running ShellCheck..."
        
        # Only fail on real errors (--severity=error)
        shellcheck --severity=error bin/s9-* lib/*.sh
        
        # Additionally print all warnings/info (does not fail CI)
        echo "--- ShellCheck Warnings (non-fatal) ---"
        shellcheck bin/s9-* lib/*.sh || true
        

    ###########################################################
    # TEST SUITE
    ###########################################################
    - name: Run Tests
      run: |
        if command -v make >/dev/null 2>&1; then
          make test
        else
          echo "No Makefile tests found."
        fi

    ###########################################################
    # COLOR RENDERING CHECK
    ###########################################################
    - name: Verify Color Rendering
      run: |
        echo "Checking for printf %b usage..."
        if grep -rq "printf.*%b" bin/ lib/; then
          echo "✓ Color rendering check passed"
        else
          echo "Warning: No printf %b found — some color sequences may not render properly"
        fi