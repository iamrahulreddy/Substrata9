name: Substrata9 CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc jq shellcheck

      - name: Make Scripts Executable
        run: |
          chmod +x bin/s9-* bin/bc
          chmod +x tests/*.sh examples/*.sh

      - name: Run ShellCheck (Errors Only)
        run: |
          echo "Running ShellCheck..."
          shellcheck -x --severity=error bin/s9-* bin/bc lib/*.sh tests/*.sh examples/*.sh
          echo "--- ShellCheck Warnings (non-fatal) ---"
          shellcheck -x bin/s9-* bin/bc lib/*.sh tests/*.sh examples/*.sh || true

      - name: Run Tests
        run: make test

      - name: Verify Forced Color Rendering
        run: |
          echo "Checking forced ANSI color output..."
          output="$(script -qefc 'bash bin/s9-tree --help' /dev/null)"
          if printf '%s' "$output" | grep -q $'\033'; then
            echo "OK: forced color rendering check passed"
          else
            echo "Forced color output did not include ANSI escape sequences"
            exit 1
          fi